name: Build edge bundle
# Rebuilds supabase/functions/vibuzz-api/bundle.js from apps/api/src (after the
# API tests pass) and commits it, so the Supabase Edge Function can import the
# bundle from a pinned commit. See docs/SETUP.md, "API no Supabase".
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/src/**'
      - 'apps/api/scripts/build-edge.mjs'
      - 'packages/shared/src/**'
      - 'package-lock.json'
      - '.github/workflows/edge-bundle.yml'
  workflow_dispatch:
permissions:
  contents: write
# Runs one at a time and always builds the latest main, so a late run never
# overwrites a newer bundle.
concurrency:
  group: edge-bundle
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @vibuzz/api
      - run: npm run build:edge
      - name: Commit the bundle if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if git diff --quiet -- supabase/functions/vibuzz-api; then
              echo "Bundle up to date."
              exit 0
            fi
            src=$(git rev-parse --short HEAD)
            git add supabase/functions/vibuzz-api
            git commit -m "Rebuild edge bundle from $src"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved; rebuilding on top of it"
            git fetch origin main
            git reset --hard origin/main
            npm run build:edge
          done
          exit 1
