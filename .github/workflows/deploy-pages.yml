name: Deploy web (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web app
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: https://luqxzunlenpsjmfqxfxi.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_sXtWWzgKxHKRNbvziWGs6w_KaL13Kjl
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      - run: cp apps/mobile/dist/index.html apps/mobile/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
